
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Trang chủ</title>
    <th:block th:replace="base :: bootstrap"></th:block>
</head>
<body>
    <div th:replace="base :: header"></div>

    <main class="container">
        <ul>
           <li class="nav-item" th:each="c: ${categories}"> 
            <a class="nav-link" href="#" th:text="${c.name}"></a> 
        </li>  
        </ul>
       
        
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Ảnh</th>
                    <th scope="col">Tên</th>
                    <th scope="col">Giá</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p:${products}">
                    <th th:text="${p.id}"></th>
                    <td th:src="${p.image}">
                        <img th:src="${p.image}" width="100"/>
                    </td>
                    <td th:text="${p.name}"></td>
                    <td th:text="${p.price}"></td>
                    <td>
                        <button class="btn btn-danger">&times;</button>
                        <a th:href="@{/edit-product/{id}(id=${p.id})}" class="btn btn-info">&#128393;</a>
                    </td>
                </tr>

            </tbody>
        </table>
    </main>

    <div th:replace="base :: footer"></div>


</body>
</html>
