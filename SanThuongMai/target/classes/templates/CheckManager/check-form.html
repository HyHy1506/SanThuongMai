<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chỉnh sửa trạng thái người bán</title>
    <th:block th:replace="base :: bootstrap"></th:block>
</head>
<body>
    <div th:replace="base :: header"></div>

    <main class="container py-5">
        <h1 class="text-center mb-4">Chỉnh sửa trạng thái người bán</h1>
        <div class="card p-4 mx-auto" style="max-width: 600px;">
            <form th:action="@{/staff/update-seller}" th:object="${seller}" method="post">
                <!-- Hidden Fields -->
                <input type="hidden" th:field="*{userId}" />

                <!-- Seller ID -->
                <div class="mb-3">
                    <label for="id" class="form-label">ID người bán</label>
                    <input type="text" class="form-control" id="id" th:value="*{user.id}" readonly>
                </div>

                <!-- Seller Name -->
                <div class="mb-3">
                    <label for="nickname" class="form-label">Tên người bán</label>
                    <input type="text" class="form-control" id="nickname" th:value="*{user.nickname}" readonly>
                </div>

                <!-- Seller Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="text" class="form-control" id="email" th:value="*{user.email}" readonly>
                </div>

                <!-- Seller Status -->
                <div class="mb-3">
                    <label for="status" class="form-label">Trạng thái <span class="text-danger">*</span></label>
                    <select class="form-select" id="status" th:field="*{status}" required>
                        <option value="PENDING">Chờ duyệt</option>
                        <option value="APPROVED">Đã duyệt</option>
                        <option value="REJECT">Từ chối</option>
                    </select>
                </div>

                <!-- Form Buttons -->
                <div class="d-flex gap-2 justify-content-center">
                    <button type="submit" class="btn btn-primary px-5">Lưu</button>
                    <a th:href="@{/staff/check}" class="btn btn-secondary px-5">Hủy</a>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="base :: footer"></div>
</body>
</html>
