<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Chỉnh sửa sản phẩm</title>
    <th:block th:replace="base :: bootstrap"></th:block>
</head>
<body>
    <div th:replace="base :: header"></div>

    <main class="container py-5">
        <h1 class="text-center mb-4">Chỉnh sửa sản phẩm</h1>
        <div class="card p-4 mx-auto" style="max-width: 600px;">
            <form method="post" th:action="@{/admin/updated-product}" th:object="${product}" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="file" class="form-label">Ảnh sản phẩm</label>
                    <input type="file" class="form-control" th:field="*{file}" id="file">
                    <img th:src="${product.image}" th:if="${product.id != null && product.image != null}" class="img-fluid mt-2 rounded" style="max-width: 200px;" alt="Ảnh lỗi"/>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Tên sản phẩm</label>
                    <input type="text" class="form-control" th:field="*{name}" id="name" placeholder="Tên sản phẩm">
                </div>
                <div class="mb-3">
                    <label for="price" class="form-label">Giá sản phẩm</label>
                    <input type="number" class="form-control" th:field="*{price}" id="price" placeholder="Giá sản phẩm">
                </div>
                <div class="mb-3">
                    <label for="inventoryQuantity" class="form-label">Số lượng tồn kho</label>
                    <input type="number" class="form-control" th:field="*{inventoryQuantity}" id="inventoryQuantity" placeholder="Số lượng tồn kho">
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Miêu tả</label>
                    <input type="text" class="form-control" th:field="*{description}" id="description" placeholder="Miêu tả">
                </div>
                <div class="mb-3">
                    <label for="shopId" class="form-label">Mã cửa hàng (Shop ID)</label>
                    <input type="text" class="form-control" th:value="*{shopId.name}" id="shopId" readonly>
                </div>
                <div class="mb-3">
                    <label for="category" class="form-label">Danh mục</label>
                    <select class="form-select" id="category" th:field="*{categoryId}">
                        <option th:each="c: ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                </div>
                
                <!-- Product Attributes Section - Now as separate parameters -->
                <div class="form-group">
                    <label>Thuộc tính</label>
                    <div id="attributes-container">
                        <!-- Existing attributes -->
                        <div th:each="attr, iterStat : ${product.productattributeSet}" class="attribute-row mb-2">
                            <!-- Hidden field for existing attribute ID -->
                            <input type="hidden" th:name="'attributeIds[' + ${iterStat.index} + ']'" th:value="${attr.id}" />
                            <div class="d-flex gap-2 align-items-center">
                                <select class="form-control" th:name="'attributeTypeIds[' + ${iterStat.index} + ']'" required style="flex: 1;">
                                    <option th:each="availableAttr : ${attributes}" 
                                            th:value="${availableAttr.id}" 
                                            th:text="${availableAttr.name}" 
                                            th:selected="${availableAttr.id == attr.attributeId.id}"></option>
                                </select>
                                <input type="text" class="form-control" 
                                       th:name="'attributeValues[' + ${iterStat.index} + ']'" 
                                       th:value="${attr.value}"
                                       placeholder="Giá trị thuộc tính" required style="flex: 2;">
                                <button type="button" class="btn btn-danger btn-sm remove-attribute">Xóa</button>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary mt-2" id="add-attribute">Thêm thuộc tính</button>
                </div>

                <div class="text-center">
                    <button class="btn btn-success px-5">Lưu sản phẩm</button>
                </div>
                
                <!-- Product fields -->
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{shopId.id}" />
                <input type="hidden" th:field="*{image}" />
                <input type="hidden" th:field="*{isActive}" />
                
                <!-- Hidden field to track total number of attributes -->
                <input type="hidden" id="attributeCount" name="attributeCount" th:value="${#lists.size(product.productattributeSet)}" />
            </form>
        </div>
    </main>

    <div th:replace="base :: footer"></div>
    
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const attributesContainer = document.getElementById('attributes-container');
            const addAttributeBtn = document.getElementById('add-attribute');
            const attributeCountInput = document.getElementById('attributeCount');
            let attributeIndex = parseInt(attributeCountInput.value) || 0;

            // Available attributes data
            const availableAttributes = /*[[${attributes}]]*/ [];

            // Add new attribute row
            addAttributeBtn.addEventListener('click', function() {
                const newAttributeRow = createAttributeRow(attributeIndex);
                attributesContainer.appendChild(newAttributeRow);
                attributeIndex++;
                attributeCountInput.value = attributeIndex;
            });

            // Remove attribute row (event delegation)
            attributesContainer.addEventListener('click', function(e) {
                if (e.target.classList.contains('remove-attribute')) {
                    e.target.closest('.attribute-row').remove();
                    updateAttributeIndices();
                }
            });

            function createAttributeRow(index) {
                const div = document.createElement('div');
                div.className = 'attribute-row mb-2';
                
                div.innerHTML = `
                    <div class="d-flex gap-2 align-items-center">
                        <select class="form-control" name="attributeTypeIds[${index}]" required style="flex: 1;">
                            <option value="">Chọn thuộc tính</option>
                            ${availableAttributes.map(attr => 
                                `<option value="${attr.id}">${attr.name}</option>`
                            ).join('')}
                        </select>
                        <input type="text" class="form-control" name="attributeValues[${index}]" placeholder="Giá trị thuộc tính" required style="flex: 2;">
                        <button type="button" class="btn btn-danger btn-sm remove-attribute">Xóa</button>
                    </div>
                `;
                
                return div;
            }

            function updateAttributeIndices() {
                const attributeRows = document.querySelectorAll('.attribute-row');
                let currentIndex = 0;
                
                attributeRows.forEach((row) => {
                    const hiddenId = row.querySelector('input[type="hidden"]');
                    const select = row.querySelector('select');
                    const input = row.querySelector('input[type="text"]');
                    
                    if (hiddenId) {
                        hiddenId.name = `attributeIds[${currentIndex}]`;
                    }
                    if (select) {
                        select.name = `attributeTypeIds[${currentIndex}]`;
                    }
                    if (input) {
                        input.name = `attributeValues[${currentIndex}]`;
                    }
                    currentIndex++;
                });
                
                attributeIndex = currentIndex;
                attributeCountInput.value = attributeIndex;
            }
        });
    </script>

    <style>
        .attribute-row {
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 10px;
            background-color: #f8f9fa;
        }
        
        .attribute-row:hover {
            background-color: #e9ecef;
        }
        
        .remove-attribute {
            white-space: nowrap;
        }
        
        .d-flex.gap-2 {
            gap: 0.5rem !important;
        }
    </style>
</body>

</html>
