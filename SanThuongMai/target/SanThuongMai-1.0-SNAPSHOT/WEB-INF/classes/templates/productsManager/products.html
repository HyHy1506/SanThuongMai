
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Trang chủ</title>
    <th:block th:replace="base :: bootstrap"></th:block>
</head>
<body>
    <div th:replace="base :: header"></div>

    <main class="container py-5">
        <h1 class="text-center mb-4">Danh sách sản phẩm</h1>
        <div class="card p-4 mb-5">
            <form th:action="@{/admin/products}" method="get">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="kw" class="form-label">Từ khóa</label>
                        <input type="text" class="form-control" id="kw" name="kw" th:value="${param.kw}" placeholder="Tìm theo tên sản phẩm">
                    </div>
                    <div class="col-md-2">
                        <label for="fromPrice" class="form-label">Giá từ</label>
                        <input type="number" class="form-control" id="fromPrice" name="fromPrice" th:value="${param.fromPrice}" placeholder="Giá tối thiểu" min="0">
                    </div>
                    <div class="col-md-2">
                        <label for="toPrice" class="form-label">Giá đến</label>
                        <input type="number" class="form-control" id="toPrice" name="toPrice" th:value="${param.toPrice}" placeholder="Giá tối đa" min="0">
                    </div>
                    <div class="col-md-3">
                        <label for="categoryId" class="form-label">Danh mục</label>
                        <select class="form-select" id="categoryId" name="categoryId">
                            <option value="">Tất cả danh mục</option>
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${selectedCategoryId != null and selectedCategoryId == c.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">Lọc</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="p:${products}">
                <div class="card h-100">
                    <img th:src="${p.image}" class="card-img-top" alt="Product Image" style="height: 200px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${p.name}"></h5>
                        <p class="card-text" th:text="'Giá: ' + ${p.price} + ' VNĐ'"></p>
                    </div>
                    <div class="card-footer d-flex justify-content-between">
                        <button class="btn btn-danger" th:onclick="'deleteProduct(\''+@{/api/products}+'\',' + ${p.id} + ')'">&times;</button>
                        <a th:href="@{/admin/edit-product/{id}(id=${p.id})}" class="btn btn-info">&#128393;</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-5">
            <a th:href="@{/admin/products(page=${currentPage - 1}, kw=${param.kw}, fromPrice=${param.fromPrice}, toPrice=${param.toPrice}, categoryId=${param.categoryId})}"
               th:class="${currentPage <= 1} ? 'btn btn-secondary disabled' : 'btn btn-primary'"
               th:disabled="${currentPage <= 1}">Trang trước</a>
            <span>Trang <span th:text="${currentPage}"></span> / <span th:text="${totalPages}"></span></span>
            <a th:href="@{/admin/products(page=${currentPage + 1}, kw=${param.kw}, fromPrice=${param.fromPrice}, toPrice=${param.toPrice}, categoryId=${param.categoryId})}"
               th:class="${currentPage >= totalPages} ? 'btn btn-secondary disabled' : 'btn btn-primary'"
               th:disabled="${currentPage >= totalPages}">Trang sau</a>
        </div>
    </main>

    <div th:replace="base :: footer"></div>
    <script th:src="@{/js/main.js}"></script>

</html>
