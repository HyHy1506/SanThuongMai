<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thống kê tần suất</title>
    <th:block th:replace="base :: bootstrap"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
</head>
<body>
    <div th:replace="base :: header"></div>

    <main class="container py-5">
        <h1 class="text-center mb-4">Thống kê tần suất</h1>

        <!-- Form lọc -->
        <div class="card p-4 mb-5">
            <form id="filterForm" method="get" th:action="@{/admin/statistics/frequency}">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="period" class="form-label">Thời gian</label>
                        <select class="form-select" id="period" name="period" onchange="togglePeriodFields(); this.form.submit()">
                            <option value="year" th:selected="${period == 'year'}">Theo năm</option>
                            <option value="month" th:selected="${period == 'month'}">Theo tháng</option>
                            <option value="quarter" th:selected="${period == 'quarter'}">Theo quý</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="year" class="form-label">Năm</label>
                        <input type="number" class="form-control" id="year" name="year" th:value="${selectedYear}" min="2000" max="2099" onchange="this.form.submit()">
                    </div>
                    <div class="col-md-2" id="monthField" style="display: none;">
                        <label for="month" class="form-label">Tháng</label>
                        <select class="form-select" id="month" name="month" onchange="this.form.submit()">
                            <option value="">Chọn tháng</option>
                            <option th:each="m : ${#numbers.sequence(1, 12)}" th:value="${m}" th:text="${'Tháng ' + m}" th:selected="${selectedMonth != null and selectedMonth == m}"></option>
                        </select>
                    </div>
                    <div class="col-md-2" id="quarterField" style="display: none;">
                        <label for="quarter" class="form-label">Quý</label>
                        <select class="form-select" id="quarter" name="quarter" onchange="this.form.submit()">
                            <option value="">Chọn quý</option>
                            <option th:each="q : ${#numbers.sequence(1, 4)}" th:value="${q}" th:text="${'Quý ' + q}" th:selected="${selectedQuarter != null and selectedQuarter == q}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="shopId" class="form-label">Cửa hàng</label>
                        <select class="form-select" id="shopId" name="shopId" onchange="this.form.submit()">
                            <option value="">Tất cả cửa hàng</option>
                            <option th:each="s : ${shops}" th:value="${s.id}" th:text="${s.name}" th:selected="${selectedShopId != null and selectedShopId == s.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="chartType" class="form-label">Loại biểu đồ</label>
                        <select class="form-select" id="chartType" name="chartType" onchange="updateChartType()">
                            <option value="bar" th:selected="${chartType == 'bar'}">Bar</option>
                            <option value="line" th:selected="${chartType == 'line'}">Line</option>
                            <option value="pie" th:selected="${chartType == 'pie'}">Pie</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>

        <!-- Biểu đồ -->
        <div class="row">
            <div class="col-12">
                <div class="card p-4 mb-4">
                    <h3 class="text-center">Tổng giao dịch</h3>
                    <canvas id="transactionChart" style="max-height: 400px;"></canvas>
                </div>
            </div>
            <div class="col-12">
                <div class="card p-4 mb-4">
                    <h3 class="text-center">Tổng sản phẩm đã bán</h3>
                    <canvas id="productChart" style="max-height: 400px;"></canvas>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="base :: footer"></div>

    <script th:inline="javascript">
        let transactionChartInstance = null;
        let productChartInstance = null;

        function togglePeriodFields() {
            const period = document.getElementById('period').value;
            document.getElementById('monthField').style.display = period === 'month' ? 'block' : 'none';
            document.getElementById('quarterField').style.display = period === 'quarter' ? 'block' : 'none';
        }

        function fetchChartData() {
            const period = document.getElementById('period').value;
            const year = document.getElementById('year').value;
            const month = document.getElementById('month').value;
            const quarter = document.getElementById('quarter').value;
            const shopId = document.getElementById('shopId').value;
            const chartType = document.getElementById('chartType').value;

            // Fetch transaction data
            fetch(`/SanThuongMai/api/statistics/frequency/transaction?period=${period}&year=${year}&month=${month}&quarter=${quarter}&shopId=${shopId}`)
                .then(response => response.json())
                .then(data => {
                    const ctx = document.getElementById('transactionChart').getContext('2d');
                    if (transactionChartInstance) {
                        transactionChartInstance.destroy();
                    }
                    transactionChartInstance = new Chart(ctx, {
                        type: chartType,
                        data: {
                            labels: data.labels,
                            datasets: [{
                                label: 'Số giao dịch',
                                data: data.data,
                                backgroundColor: chartType === 'pie' ? [
                                    '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
                                    '#9966FF', '#FF9F40', '#E7E9ED', '#76D7C4'
                                ] : 'rgba(255, 99, 132, 0.2)',
                                borderColor: chartType === 'pie' ? '#fff' : 'rgba(255, 99, 132, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: chartType !== 'pie' ? {
                                y: {
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: 'Số giao dịch'
                                    }
                                },
                                x: {
                                    title: {
                                        display: true,
                                        text: 'Cửa hàng'
                                    }
                                }
                            } : {},
                            plugins: {
                                legend: {
                                    display: chartType === 'pie'
                                }
                            }
                        }
                    });
                })
                .catch(error => console.error('Error fetching transaction data:', error));

            // Fetch product data
            fetch(`/SanThuongMai/api/statistics/frequency/product?period=${period}&year=${year}&month=${month}&quarter=${quarter}&shopId=${shopId}`)
                .then(response => response.json())
                .then(data => {
                    const ctx = document.getElementById('productChart').getContext('2d');
                    if (productChartInstance) {
                        productChartInstance.destroy();
                    }
                    productChartInstance = new Chart(ctx, {
                        type: chartType,
                        data: {
                            labels: data.labels,
                            datasets: [{
                                label: 'Số sản phẩm',
                                data: data.data,
                                backgroundColor: chartType === 'pie' ? [
                                    '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
                                    '#9966FF', '#FF9F40', '#E7E9ED', '#76D7C4'
                                ] : 'rgba(54, 162, 235, 0.2)',
                                borderColor: chartType === 'pie' ? '#fff' : 'rgba(54, 162, 235, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: chartType !== 'pie' ? {
                                y: {
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: 'Số sản phẩm'
                                    }
                                },
                                x: {
                                    title: {
                                        display: true,
                                        text: 'Cửa hàng'
                                    }
                                }
                            } : {},
                            plugins: {
                                legend: {
                                    display: chartType === 'pie'
                                }
                            }
                        }
                    });
                })
                .catch(error => console.error('Error fetching product data:', error));
        }

        function updateChartType() {
            fetchChartData();
        }

        document.addEventListener('DOMContentLoaded', () => {
            togglePeriodFields();
            fetchChartData();
        });
    </script>
</body>
</html>
