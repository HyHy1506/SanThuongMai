<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Danh sách người dùng</title>
    <th:block th:replace="base :: bootstrap"></th:block>
</head>

<body>
    <div th:replace="base :: header"></div>
    <!-- Hiển thị thông báo thành công -->
    <div th:if="${message}" class="alert alert-success" role="alert">
        <span th:text="${message}"></span>
    </div>

    <!-- Hiển thị thông báo lỗi -->
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}"></span>
    </div>
    <main class="container py-5">
        <h1 class="text-center mb-4">Danh sách người dùng</h1>
        <div class="card p-4 mb-5">
            <form th:action="@{/admin/users}" method="get">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="kw" class="form-label">Tên người dùng</label>
                        <input type="text" class="form-control" id="kw" name="kw" th:value="${param.kw}"
                            placeholder="Tìm theo tên">
                    </div>
                    <div class="col-md-3">
                        <label for="isActive" class="form-label">Trạng thái</label>
                        <select class="form-select" id="isActive" name="isActive">
                            <option value="">Tất cả</option>
                            <option value="true"
                                th:selected="${selectedIsActive !=null and selectedIsActive == 'true'}">Hoạt động
                            </option>
                            <option value="false"
                                th:selected="${selectedIsActive !=null and selectedIsActive == 'false'}">Không hoạt động
                            </option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">Lọc</button>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <a th:href="@{/admin/add-user}" class="btn btn-success w-100">Thêm người dùng</a>
                    </div>
                </div>
            </form>
        </div>

        <div class="table-responsive">
            <table class="table table-hover table-bordered">
                <thead class="table-light">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Tên</th>
                        <th scope="col">Vai trò</th>
                        <th scope="col">Trạng thái</th>
                        <th scope="col">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.nickname}"></td>
                        <td th:text="${user.userRole}"></td>
                        <td>
                            <span th:class="${user.isActive} ? 'badge bg-success' : 'badge bg-danger'"
                                th:text="${user.isActive} ? 'Hoạt động' : 'Không hoạt động'"></span>
                        </td>
                        <td>
                            <a th:href="@{'/admin/users/'+${user.id}}" class="btn btn-sm btn-info me-1">Sửa</a>
                            <button class="btn btn-sm btn-danger"
                                th:onclick="'deleteUser(\''+@{/api/users}+'\',' + ${user.id} + ')'">Xóa</button>
                        </td>
                    </tr>
                    <tr th:if="${users.isEmpty}">
                        <td colspan="5" class="text-center">Không tìm thấy người dùng nào</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-5">
            <a th:href="@{/admin/users(page=${currentPage - 1}, kw=${param.kw}, isActive=${param.isActive})}"
                th:class="${currentPage <= 1} ? 'btn btn-secondary disabled' : 'btn btn-primary'"
                th:disabled="${currentPage <= 1}">Trang trước</a>
            <span>Trang <span th:text="${currentPage}"></span> / <span th:text="${totalPages}"></span></span>
            <a th:href="@{/admin/users(page=${currentPage + 1}, kw=${param.kw}, isActive=${param.isActive})}"
                th:class="${currentPage >= totalPages} ? 'btn btn-secondary disabled' : 'btn btn-primary'"
                th:disabled="${currentPage >= totalPages}">Trang sau</a>
        </div>
    </main>

    <div th:replace="base :: footer"></div>
    <script th:src="@{/js/main.js}"></script>
</body>

</html>
