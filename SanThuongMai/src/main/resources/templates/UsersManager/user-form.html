
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm/Sửa người dùng</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="base :: bootstrap"></th:block>
</head>
<body>
    <div th:replace="base :: header"></div>

    <main class="container py-5">
        <h1 class="text-center mb-4" th:text="${user.id != null} ? 'Chỉnh sửa người dùng' : 'Thêm người dùng'"></h1>
        <div class="card p-4 mx-auto" style="max-width: 600px;">
            <form th:action="@{/admin/update-user}" th:object="${user}" method="post" enctype="multipart/form-data">
                <!-- Hidden Fields -->
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{avatar}" />
                <div class="mb-3" th:if="${user.id != null}">
                    <input type="hidden" th:field="*{password}" />
                </div>
                <!-- User ID (Shown only when editing) -->
                <div class="mb-3" th:if="${user.id != null}">
                    <label for="id" class="form-label">ID người dùng</label>
                    <input type="text" class="form-control" id="id" th:value="*{id}" readonly>
                </div>

                 <!-- Username -->
                 <div class="mb-3">
                    <label for="username" class="form-label">Tên tài khoản <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="username" th:field="*{username}" required
                           placeholder="Nhập tên tài khoản">
                    <div class="invalid-feedback" th:errors="*{username}"></div>
                </div>

                <!-- Nickname -->
                <div class="mb-3">
                    <label for="nickname" class="form-label">Tên người dùng <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="nickname" th:field="*{nickname}" required
                           placeholder="Nhập tên người dùng">
                    <div class="invalid-feedback" th:errors="*{nickname}"></div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" th:field="*{email}" required
                           placeholder="Nhập email">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <!-- Password (only for adding new user) -->
                <div class="mb-3" th:unless="${user.id != null}">
                    <label for="password" class="form-label">Mật khẩu <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="password" name="password" required th:field="*{password}"
                           placeholder="Nhập mật khẩu">
                    <div class="invalid-feedback">Mật khẩu là bắt buộc</div>
                </div>

                <!-- Role -->
                <div class="mb-3">
                    <label for="role" class="form-label">Vai trò <span class="text-danger">*</span></label>
                    <select class="form-select" id="role" th:field="*{userRole}" required>
                        <option value="Customer">Khách hàng</option>
                        <option value="Seller">Người bán</option>
                        <option value="Admin">Quản trị viên</option>
                        <option value="Staff">Nhân viên</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{userRole}"></div>
                </div>

                <!-- Status -->
                <div class="mb-3">
                    <label for="isActive" class="form-label">Trạng thái</label>
                    <select class="form-select" id="isActive" th:field="*{isActive}">
                        <option value="true">Hoạt động</option>
                        <option value="false">Không hoạt động</option>
                    </select>
                </div>

                <!-- Avatar -->
                <div class="mb-3">
                    <label for="avatar" class="form-label">Ảnh đại diện</label>
                    <input type="file" class="form-control" id="avatar" name="avatar" th:field="*{file}">
                    <img th:src="${user.avatar}" th:if="${user.id != null && user.avatar != null}" class="img-fluid mt-2 rounded" style="max-width: 200px;" alt="Ảnh lỗi"/>
                </div>

                <!-- Form Buttons -->
                <div class="d-flex gap-2 justify-content-center">
                    <button type="submit" class="btn btn-primary px-5">Lưu</button>
                    <a th:href="@{/admin/users}" class="btn btn-secondary px-5">Hủy</a>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="base :: footer"></div>
</body>
</html>
