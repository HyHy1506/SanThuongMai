<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng</title>
    <th:block th:replace="base :: bootstrap"></th:block>
    <style>
        .table th,
        .table td {
            vertical-align: middle;
        }

        .nav-tabs .nav-link {
            color: #495057;
        }

        .nav-tabs .nav-link.active {
            background-color: #f8f9fa;
        }

        .filter-form {
            max-width: 300px;
        }
    </style>
</head>

<body>
    <div th:replace="base :: header"></div>
    <div class="container mt-5 min-vh-100">
        <h1 class="mb-4">Quản lý hóa đơn</h1>

        <ul class="nav nav-tabs" id="transactionTabs">
            <li class="nav-item">
                <button class="nav-link " 
                    type="button"><a th:href="@{/staff/transactions/customer}">Hóa đơn người mua</a></button>
            </li>
            <li class="nav-item">
                <button class="nav-link active"  type="button">Hóa đơn người bán</button>
            </li>
        </ul>

        <div >
           

            <!-- Seller Payments Tab -->
            <div  id="seller" >
                <h3>Hóa đơn người bán</h3>
                <form th:action="@{/staff/transactions/seller}" method="get" class="filter-form mb-3">
                    
                    <div class="mb-3">
                        <label for="isPayForSeller" class="form-label">Tình trạng hóa đơn</label>
                        <select name="isPayForSeller" id="isPayForSeller" class="form-select">
                            <option value="">Tất cả</option>
                            <option th:value="true" th:selected="${selectedIsPayForSeller == 'true'}">Đã trả</option>
                            <option th:value="false" th:selected="${selectedIsPayForSeller == 'false'}">Chưa trả</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Bộ lọc</button>
                </form>

                <table class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Người bán</th>
                            <th>Giá tiền</th>
                            <th>Tình trạng hóa đơn</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="payment : ${payments}">
                            <td><a th:href="@{/staff/transactions/{id}(id=${payment.id})}" th:text="${payment.id}"></a>
                            </td>
                            <td th:text="${payment.customerId.user.nickname}"></td>
                            <td th:text="${payment.price}"></td>
                            <td th:text="${payment.isPayForSeller ? 'Đã trả cho người bán' : 'Chưa trả cho người bán'}"></td>
                            <td>
                                <form th:if="${payment.isPay and !payment.isPayForSeller}"
                                    th:action="@{/staff/transactions/mark-paid-seller/{id}(id=${payment.id})}"
                                    method="post" class="d-inline">
                                    <button type="submit" class="btn btn-success btn-sm">Trả tiền cho người bán</button>
                                </form>
                                <span th:if="${!payment.isPay or payment.isPayForSeller}" class="text-muted">Đã trả</span>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <nav th:if="${totalPages > 1}">
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                            <a class="page-link"
                                th:href="@{/staff/transactions/seller(page=${currentPage - 1}, isPayForSeller=${selectedIsPayForSeller})}">Trước</a>
                        </li>
                        <li class="page-item" th:each="page : ${#numbers.sequence(1, totalPages)}"
                            th:classappend="${page == currentPage} ? 'active'">
                            <a class="page-link"
                                th:href="@{/staff/transactions/seller(page=${page}, isPayForSeller=${selectedIsPayForSeller})}"
                                th:text="${page}"></a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                            <a class="page-link"
                                th(href="@{/staff/transactions/seller(page=${currentPage + 1}, isPayForSeller=${selectedIsPayForSeller})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
    <div th:replace="base :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
